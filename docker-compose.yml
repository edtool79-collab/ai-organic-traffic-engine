services:
  dashboard:
    build: .
    container_name: wtg-dashboard
    ports:
      - "127.0.0.1:4310:4310"
    shm_size: "2gb"
    environment:
      - NODE_ENV=production
      - PORT=4310
    volumes:
      - ./config.json:/app/config.json
      - ./proxies.txt:/app/proxies.txt
      - ./data:/app/data
      - ./session-profiles:/app/session-profiles
      - ./site-profiles:/app/site-profiles
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/crawleeRunner.js", "/app/config.json"]
    shm_size: "2gb"
    environment:
      - NODE_ENV=production
      - WTG_DOCKER=1
      - WTG_BROWSER_CHANNEL=bundle
      - CONCURRENCY=${WTG_CONCURRENCY:-10}
      - MIN_CONCURRENCY=${WTG_MIN_CONCURRENCY:-4}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./proxies.txt:/app/proxies.txt:ro
      - ./data:/app/data
      - ./session-profiles:/app/session-profiles
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2560M
    profiles:
      - swarm

  lightpanda:
    image: lightpanda/browser:latest
    command: ["lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222"]
    ports:
      - "127.0.0.1:9222:9222"
    restart: unless-stopped
    profiles:
      - lightpanda
