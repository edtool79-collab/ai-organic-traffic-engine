<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Recorder — US IP</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0b1220 0%, #101a2e 60%, #0b1220 100%);
    color: #e8eefc; font-family: "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: min(420px, 94vw); background: #131c30; border: 1px solid #263355;
    border-radius: 18px; padding: 22px 20px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
  .sub { margin: 0 0 16px; color: #8ea0c4; font-size: 12.5px; line-height: 1.5; }
  .state {
    display: flex; align-items: center; gap: 10px; background: #0d1526;
    border: 1px solid #22304f; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
    font-size: 13.5px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #44506e; flex: 0 0 auto; }
  .dot.live { background: #ff3b47; animation: blink 1s steps(2, start) infinite; }
  .dot.done { background: #35d07f; }
  @keyframes blink { 50% { opacity: .25; } }
  .rec { color: #ff5963; font-weight: 700; letter-spacing: 1px; }
  .timer { font-variant-numeric: tabular-nums; color: #9fb2d8; font-size: 12.5px; margin-inline-start: auto; }
  .host { margin: 0 0 14px; color: #7d90b8; font-size: 11.5px; word-break: break-all; min-height: 15px; }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 13px 10px; border-radius: 12px; border: 0; cursor: pointer;
    font-size: 15px; font-weight: 700; font-family: inherit; transition: transform .05s, filter .15s;
  }
  button:active { transform: scale(.98); }
  button:disabled { cursor: not-allowed; opacity: .35; filter: grayscale(.6); }
  .start { background: linear-gradient(135deg, #2f7cf6, #1f5fd0); color: #fff; }
  .stop { background: linear-gradient(135deg, #e5484d, #c2353a); color: #fff; }
  .note {
    margin: 14px 0 0; font-size: 12.5px; line-height: 1.55; color: #8ea0c4;
    background: #0d1526; border: 1px solid #22304f; border-radius: 10px; padding: 9px 11px; display: none;
  }
  .note.err { color: #ffb4b8; border-color: #57343c; background: #1a1016; }
  .note.ok { color: #b6eccd; border-color: #2c4a3a; background: #101a14; }
  .foot { margin: 14px 0 0; text-align: center; color: #55668b; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <h1>🎬 Mock Recorder — Browser with US IP</h1>
  <p class="sub">Opens a real browser on our conversion page through a US proxy — a fresh IP every time. Visual indicator only, no steps are recorded.</p>
  <div class="state">
    <span id="dot" class="dot"></span>
    <span id="stateText">Ready to start</span>
    <span id="timer" class="timer"></span>
  </div>
  <p id="hostLine" class="host"></p>
  <div class="row">
    <button id="startBtn" class="start">▶ Start Recording</button>
    <button id="stopBtn" class="stop" disabled>■ Stop Recording</button>
  </div>
  <p id="note" class="note"></p>
  <p class="foot">After stopping, you can click start again to launch with a different IP.</p>
</div>
<script>
(function () {
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const dot = document.getElementById('dot');
  const stateText = document.getElementById('stateText');
  const timerEl = document.getElementById('timer');
  const hostLine = document.getElementById('hostLine');
  const note = document.getElementById('note');

  let lastProxyHost = '';
  let lastStatus = '';
  let pollTimer = null;
  let tickTimer = null;

  function showNote(text, kind) {
    note.textContent = text;
    note.className = 'note ' + (kind || '');
    note.style.display = text ? 'block' : 'none';
  }

  function setUi(rec) {
    startBtn.disabled = rec;
    stopBtn.disabled = !rec;
    dot.className = 'dot' + (rec ? ' live' : (lastStatus === 'completed' ? ' done' : ''));
    if (rec) {
      stateText.innerHTML = '<span class="rec">● REC</span>&nbsp; Browser open with US IP — browse freely';
    } else if (lastStatus === 'completed') {
      stateText.textContent = 'Browser closed — ready for a new session with a fresh IP';
    } else {
      stateText.textContent = 'Ready to start';
    }
  }

  function startTick(startedAt) {
    stopTick();
    tickTimer = setInterval(() => {
      const secs = Math.max(0, Math.floor((Date.now() - new Date(startedAt).getTime()) / 1000));
      const m = String(Math.floor(secs / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      timerEl.textContent = m + ':' + s;
    }, 1000);
  }
  function stopTick() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } timerEl.textContent = ''; }

  async function poll() {
    try {
      const r = await fetch('/api/recorder/status');
      const d = await r.json();
      const rec = d && d.recorder ? d.recorder : null;
      const active = Boolean(rec && rec.active);
      lastStatus = rec ? String(rec.status || '') : '';
      setUi(active);
      if (active) {
        if (rec.startedAt) startTick(rec.startedAt);
        if (rec.mock && !lastProxyHost) hostLine.textContent = 'Browser open (mock) — IP is displayed during standard runs';
      }
    } catch { /* Server temporarily unreachable — keep polling */ }
  }

  pollTimer = setInterval(poll, 2500);
  poll();

  startBtn.addEventListener('click', async () => {
    showNote('');
    startBtn.disabled = true;
    try {
      const r = await fetch('/api/recorder/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proxyMode: 'us', mock: true }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) {
        startBtn.disabled = false;
        const msg = d && d.error ? d.error : ('Failed to launch browser (HTTP ' + r.status + ')');
        showNote(msg, 'err');
        poll();
        return;
      }
      lastProxyHost = d.proxyHost || '';
      hostLine.textContent = lastProxyHost && lastProxyHost !== 'DIRECT'
        ? ('Fresh US IP loaded via server: ' + lastProxyHost)
        : (d.proxyCountry === 'DIRECT' ? 'Direct connection from local machine (no proxy)' : '');
      setUi(true);
      if (d.recorder && d.recorder.startedAt) startTick(d.recorder.startedAt);
      showNote('Browser opened. Switch to the browser window, browse freely, then return here and click "Stop Recording".', 'ok');
    } catch (e) {
      startBtn.disabled = false;
      showNote('Server communication error: ' + (e && e.message ? e.message : e), 'err');
    }
  });

  stopBtn.addEventListener('click', async () => {
    showNote('');
    stopBtn.disabled = true;
    try {
      const r = await fetch('/api/recorder/stop', { method: 'POST' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) {
        stopBtn.disabled = false;
        showNote(d && d.error ? d.error : 'Failed to stop recording (HTTP ' + r.status + ')', 'err');
        return;
      }
      stopTick();
      hostLine.textContent = '';
      setUi(false);
      showNote('Browser closed. Click "Start Recording" again to launch with a different IP.', 'ok');
    } catch (e) {
      stopBtn.disabled = false;
      showNote('Server communication error: ' + (e && e.message ? e.message : e), 'err');
    }
  });
})();
</script>
</body>
</html>
